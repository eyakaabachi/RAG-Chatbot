<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Assistant — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* new aesthetic palette */
            --bg: #f6f9fc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e4e9f0;
            --border-strong: #c8d0dc;
            --text: #0b1a2b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;

            --accent: #4f46e5;
            --accent-dark: #4338ca;
            --accent-light: #eef2ff;
            --accent-glow: rgba(79, 70, 229, 0.15);
            --accent-gradient: linear-gradient(145deg, #4f46e5, #7c3aed);

            --warm: #d97706;
            --warm-light: #fffbeb;
            --danger: #dc2626;
            --danger-light: #fef2f2;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(15, 23, 42, 0.10);
            --shadow-glow: 0 0 0 4px rgba(79, 70, 229, 0.12);

            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(ellipse at 30% 20%, rgba(79, 70, 229, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(124, 58, 237, 0.04) 0%, transparent 60%);
        }

        /* ── app container ── */
        .app {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 32px 28px 28px;
            height: fit-content;
            max-height: calc(100vh - 48px);
            min-height: 580px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            transition: box-shadow 0.3s ease;
        }

        /* ── header ── */
        header {
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .header-left {
            flex: 1;
            min-width: 200px;
        }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-light);
            display: inline-block;
            padding: 2px 14px 2px 12px;
            border-radius: 20px;
            margin-bottom: 8px;
            border: 1px solid rgba(79, 70, 229, 0.08);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0 0 4px 0;
            color: var(--text);
            background: linear-gradient(135deg, var(--text), var(--accent-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 520px;
        }

        .lang-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 8px;
        }

        .lang-tags span {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px 12px 2px 10px;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .lang-tags span::before {
            content: "◆";
            color: var(--accent);
            font-size: 7px;
            opacity: 0.7;
        }

        /* ── thread ── */
        #thread {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 4px 0 20px;
            min-height: 200px;
            max-height: 480px;
            scroll-behavior: smooth;
        }

        #thread::-webkit-scrollbar {
            width: 4px;
        }
        #thread::-webkit-scrollbar-track {
            background: transparent;
        }
        #thread::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }

        /* ── messages ── */
        .msg {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 14.5px;
            line-height: 1.6;
            animation: msgIn 0.3s cubic-bezier(0.2, 0, 0, 1);
            word-break: break-word;
        }

        @keyframes msgIn {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .msg.bot .status {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 12px 2px 8px;
            border-radius: 20px;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }

        .msg.bot .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .status.found {
            background: var(--accent-light);
            color: var(--accent);
            border-color: rgba(79, 70, 229, 0.15);
        }
        .status.found::before {
            background: var(--accent);
        }

        .status.partial {
            background: var(--warm-light);
            color: var(--warm);
            border-color: rgba(217, 119, 6, 0.15);
        }
        .status.partial::before {
            background: var(--warm);
        }

        .status.notfound {
            background: var(--danger-light);
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.1);
        }
        .status.notfound::before {
            background: var(--danger);
        }

        .status.thinking {
            background: #f1f5f9;
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .status.thinking::before {
            background: var(--text-muted);
            animation: pulseDot 1s infinite;
        }

        @keyframes pulseDot {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ── citations ── */
        .citations {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .citation {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--surface);
            padding: 6px 14px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            line-height: 1.5;
            transition: background var(--transition), border-color var(--transition);
        }

        .citation:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
        }

        .citation b {
            color: var(--text);
            font-weight: 600;
        }

        .citation .quote {
            color: var(--text-secondary);
            font-style: italic;
        }

        /* ── caveat ── */
        .caveat {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--warm);
            background: var(--warm-light);
            padding: 8px 16px;
            border-radius: var(--radius-xs);
            border-left: 3px solid var(--warm);
            line-height: 1.5;
        }

        /* ── form ── */
        form {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 18px;
            margin-top: 2px;
        }

        input[type="text"] {
            flex: 1;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
            outline: none;
            min-width: 0;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: var(--shadow-glow);
            background: var(--surface);
        }

        button {
            padding: 13px 28px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent-gradient);
            color: white;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.2);
            letter-spacing: 0.01em;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.30);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.15);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hint {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 14px;
            text-align: center;
            letter-spacing: 0.02em;
            padding: 0 4px;
            opacity: 0.8;
        }

        .hint::before {
            content: "⌘ ";
            opacity: 0.5;
        }

        /* ── empty state ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-muted);
            text-align: center;
            padding: 30px 10px;
            gap: 8px;
        }

        .empty-state .icon {
            font-size: 36px;
            opacity: 0.6;
            margin-bottom: 4px;
            background: var(--bg);
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        .empty-state .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .empty-state .desc {
            font-size: 13px;
            max-width: 340px;
            color: var(--text-muted);
        }

        /* ── responsive ── */
        @media (max-width: 600px) {
            body {
                padding: 12px 8px;
            }
            .app {
                padding: 20px 16px 20px;
                max-height: calc(100vh - 24px);
                border-radius: 12px;
            }
            h1 {
                font-size: 21px;
            }
            .sub {
                font-size: 12.5px;
            }
            .msg {
                max-width: 94%;
                font-size: 13.5px;
                padding: 12px 14px;
            }
            form {
                flex-wrap: wrap;
            }
            button {
                width: 100%;
                justify-content: center;
                padding: 14px;
            }
            .lang-tags span {
                font-size: 9px;
                padding: 2px 10px;
            }
            header {
                flex-direction: column;
            }
            .header-left {
                width: 100%;
            }
            #thread {
                max-height: 340px;
                min-height: 140px;
            }
        }

        @media (max-width: 400px) {
            .app {
                padding: 14px 12px 16px;
            }
            .msg {
                max-width: 98%;
                font-size: 13px;
            }
            input[type="text"] {
                font-size: 13px;
                padding: 11px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <header>
            <div class="header-left">
                <div class="eyebrow">Doc Intel · Prototype</div>
                <h1>Ask the policy documents</h1>
                <div class="sub">Grounded answers with citations and confidence flags — never a bare string.</div>
                <div class="lang-tags">
                    <span>FR corpus</span>
                    <span>EN corpus</span>
                    <span>hybrid retrieval</span>
                </div>
            </div>
        </header>

        <div id="thread">
            <!-- empty state rendered by JS -->
        </div>

        <form id="ask-form">
            <input id="question" type="text"
            placeholder="Quel est le délai de déclaration d'un sinistre ? / What's the claim reporting deadline?"
            autocomplete="off" />
            <button id="send" type="submit">Ask</button>
        </form>
        <div class="hint">Try the same question in French and English — the retrieval pipeline finds the same answer either way.</div>
    </div>

    <script>
        const thread = document.getElementById('thread');
        const form = document.getElementById('ask-form');
        const input = document.getElementById('question');
        const sendBtn = document.getElementById('send');

        let hasMessages = false;

        function showEmptyState() {
            if (hasMessages) return;
            const empty = document.createElement('div');
            empty.className = 'empty-state';
            empty.id = 'empty-state';
            empty.innerHTML = `
            <div class="icon">📄</div>
            <div class="title">No questions yet</div>
            <div class="desc">Ask something about the policy documents above.</div>
          `;
            thread.appendChild(empty);
        }

        function removeEmptyState() {
            const empty = document.getElementById('empty-state');
            if (empty) empty.remove();
        }

        function addMessage(role, html) {
            removeEmptyState();
            hasMessages = true;
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = html;
            thread.appendChild(div);
            thread.scrollTop = thread.scrollHeight;
        }

        function statusLabel(answer) {
            if (!answer.answer_found) return ['notfound', 'Not found'];
            if (!answer.complete_answer_found) return ['partial', 'Partial answer'];
            return ['found', 'Answer found'];
        }

        // initial empty state
        showEmptyState();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            addMessage('user', question);
            input.value = '';
            sendBtn.disabled = true;

            // thinking message
            addMessage('bot', '<span class="status thinking">… thinking</span>');

            try {
                const res = await fetch('/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();

                // remove thinking message
                thread.lastChild.remove();

                const [cls, label] = statusLabel(data);
                const confidence = data.confidence != null ? Math.round(data.confidence * 100) : '?';

                let html =
                    `<span class="status ${cls}">${label} · confidence ${confidence}%</span>`;
                html += `<div>${data.value ? data.value : 'No grounded answer available.'}</div>`;

                if (data.citations && data.citations.length) {
                    html += '<div class="citations">';
                    data.citations.forEach(c => {
                        const quote = c.quote ? ` — <span class="quote">“${c.quote}”</span>` : '';
                        html += `<div class="citation"><b>${c.doc_id}</b> · ${c.section || 'n/a'}${quote}</div>`;
                    });
                    html += '</div>';
                }

                if (data.caveat) {
                    html += `<div class="caveat">${data.caveat}</div>`;
                }

                addMessage('bot', html);

            } catch (err) {
                if (thread.lastChild) thread.lastChild.remove();
                addMessage('bot', '<span class="status notfound">Error</span><div>Could not reach the backend.</div>');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        });

        // allow Ctrl+Enter to submit
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>

</body>
</html>
